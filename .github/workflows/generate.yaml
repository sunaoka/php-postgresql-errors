name: Generate PostgreSQL Error Codes

on:
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate PostgreSQL Error Codes
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 60
          max_attempts: 3
          command: make

      - name: Syntax check
        run: php -l -n -d error_reporting=E_ALL ./src/PostgresError.php

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: Update Error Code
          delete-branch: true
          title: Update Error Code
          body: |
            Error codes have been updated.

            - https://github.com/postgres/postgres/blob/master/src/backend/utils/errcodes.txt
